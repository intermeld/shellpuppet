# Verify a release once a maintainer has approved its staged version on npm.
#
# Run by hand after the approval (docs/reference/releasing.md):
#   gh workflow run verify-release.yml -f version=<x.y.z> -f run_id=<Publish run id>
#
# It checks three things:
#   - npm serves byte for byte the tarball that the Publish run checked;
#   - the provenance statement names this repository, publish.yml, the
#     version's tag, that Publish run and the commit it built, and describes
#     that same tarball;
#   - npm verifies the package's registry signature and attestations.
name: Verify release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The approved version, without the v (for example 0.1.0)'
        required: true
      run_id:
        description: 'The id of the Publish run that staged it'
        required: true
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: The inputs are a version and a run id
        env:
          VERSION: ${{ inputs.version }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must look like 1.2.3"; exit 1; }
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::run_id must be a number"; exit 1; }
      # The artefact is trusted only from a successful Publish run on this
      # version's tag. Any other run's artefact named `package` must not stand
      # in for the checked tarball.
      - name: The run is a successful Publish run for this version's tag
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          IFS='|' read -r path branch event conclusion head_sha < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" \
            --jq '"\(.path)|\(.head_branch)|\(.event)|\(.conclusion)|\(.head_sha)"')
          if [ "$path" != ".github/workflows/publish.yml" ] || [ "$branch" != "v$VERSION" ] \
            || [ "$event" != "push" ] || [ "$conclusion" != "success" ]; then
            echo "::error::Run $RUN_ID is not a successful Publish run for tag v$VERSION ($path, $branch, $event, $conclusion)."
            exit 1
          fi
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "Run $RUN_ID is the successful Publish run for v$VERSION, at $head_sha."
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.x'
      - run: npm install --global npm@11.20.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: npm serves the tarball the Publish run checked
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tarball="package/shellpuppet-$VERSION.tgz"
          if [ ! -f "$tarball" ]; then
            echo "::error::The Publish run's artefact holds no shellpuppet-$VERSION.tgz."
            exit 1
          fi
          checked="sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 -w0)"
          served="$(npm view "shellpuppet@$VERSION" dist.integrity)"
          if [ "$checked" != "$served" ]; then
            echo "::error::npm serves a different tarball for shellpuppet@$VERSION than the Publish run checked."
            exit 1
          fi
          echo "npm serves the tarball the Publish run checked."
      - name: The provenance names this repository, publish.yml, the tag, the run and its commit
        env:
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
          HEAD_SHA: ${{ steps.run.outputs.head_sha }}
        run: |
          set -euo pipefail
          curl -fsS "https://registry.npmjs.org/-/npm/v1/attestations/shellpuppet@$VERSION" > attestations.json
          node - <<'EOF'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const { VERSION, REPOSITORY, RUN_ID, HEAD_SHA } = process.env;
          const fail = (message) => {
            console.log(`::error::${message}`);
            process.exit(1);
          };
          const { attestations } = JSON.parse(fs.readFileSync('attestations.json', 'utf8'));
          const slsa = attestations.find((a) => a.predicateType.startsWith('https://slsa.dev/provenance/'));
          if (!slsa) fail(`shellpuppet@${VERSION} has no SLSA provenance statement.`);
          const statement = JSON.parse(Buffer.from(slsa.bundle.dsseEnvelope.payload, 'base64').toString('utf8'));
          const workflow = statement.predicate.buildDefinition.externalParameters.workflow;
          const expected = {
            repository: REPOSITORY,
            path: '.github/workflows/publish.yml',
            ref: `refs/tags/v${VERSION}`,
          };
          for (const [key, value] of Object.entries(expected)) {
            if (workflow[key] !== value) fail(`The provenance ${key} is ${workflow[key]}, not ${value}.`);
          }
          // The run that built it, whichever attempt staged it, and the commit
          // that run was on.
          const invocation = statement.predicate.runDetails?.metadata?.invocationId ?? '';
          if (!invocation.startsWith(`${REPOSITORY}/actions/runs/${RUN_ID}/attempts/`)) {
            fail(`The provenance comes from ${invocation || 'an unnamed run'}, not run ${RUN_ID}.`);
          }
          const commits = (statement.predicate.buildDefinition.resolvedDependencies ?? []).map((d) => d.digest?.gitCommit);
          if (!commits.includes(HEAD_SHA)) fail(`The provenance names commit ${commits.join(', ') || 'none'}, not ${HEAD_SHA}.`);
          const subject = statement.subject.find((s) => s.name === `pkg:npm/shellpuppet@${VERSION}`);
          if (!subject) fail(`The provenance statement does not name shellpuppet@${VERSION}.`);
          const tarball = fs.readFileSync(`package/shellpuppet-${VERSION}.tgz`);
          const digest = crypto.createHash('sha512').update(tarball).digest('hex');
          if (subject.digest.sha512 !== digest) fail('The provenance statement describes a different tarball.');
          console.log(`Provenance: ${workflow.repository}, ${workflow.path}, ${workflow.ref}, ${invocation}, ${HEAD_SHA} and this tarball.`);
          EOF
      - name: npm verifies the signature and attestations
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir check && cd check
          npm init -y > /dev/null
          npm install "shellpuppet@$VERSION" --ignore-scripts --no-audit --no-fund
          npm audit signatures
