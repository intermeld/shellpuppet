# Developer Certificate of Origin check.
#
# Every commit in a pull request must carry a "Signed-off-by: Name <email>"
# line (git commit -s). See CONTRIBUTING.md and the DCO file at the root.
# The check reads the commits between the PR base and head; it needs full
# history, so fetch-depth is 0.
name: DCO
on:
  pull_request:
permissions:
  contents: read
jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          missing=0
          for c in $(git rev-list "$BASE".."$HEAD"); do
            if git log -1 --format=%B "$c" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "ok      $c"
            else
              echo "::error::Commit $c has no Signed-off-by line. Add one with: git commit --amend -s (or git rebase --signoff)."
              missing=1
            fi
          done
          exit "$missing"
