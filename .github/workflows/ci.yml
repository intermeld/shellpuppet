# Cross-platform CI (design §6). The matrix exists to catch divergence between
# Windows, Linux and macOS early, and between the supported Node lines.
# The Publish workflow calls this one against every release tag.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node: ['22.x', '24.x', '26.x']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      # node-pty's exit watchers access-violated a Windows integration fork
      # while using a shared terminal list without a lock. That race is fixed
      # upstream from 1.2.0-beta.13 (microsoft/node-pty#922) and the pin is
      # 1.2.0-beta.18, so this retry is transitional: kept for one release of
      # evidence that the pin holds, then to be dropped. Retry the full suite
      # once only for that exact crash and only with no failed tests.
      - run: node --test scripts/retry-native-worker-crash.test.mjs
      - run: node scripts/retry-native-worker-crash.mjs
        if: runner.os == 'Windows'
      - run: npm test
        if: runner.os != 'Windows'
      # The viewer page as headless Chromium drew it, for a human to look at
      # (test/integration/viewer-capture.test.ts). Absent where the test skipped.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: viewer-capture-${{ matrix.os }}-node${{ matrix.node }}
          path: test-results/
          if-no-files-found: ignore
  # The package as a user gets it. The test job runs from the source tree, so
  # it cannot notice a file missing from the package, a broken install script
  # or a command shim that does not start. This job packs the tree, installs
  # the tarball globally into a fresh prefix, lists the MCP server's tools,
  # drives one session through the installed command and loads the viewer
  # page with every file it asks for (scripts/package-smoke.mjs).
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/package-smoke.mjs

  # The same check under npm 12, which runs a dependency's install scripts only
  # when the person installing allows them, on Node 24:
  # - Windows and macOS install as the README says, with no flag. node-pty's
  #   prebuilt binaries need no script there, and ShellPuppet restores the
  #   macOS spawn-helper's execute bit itself. The runner's prefix is its own,
  #   so this is the user-owned install. A root-owned one, where the chmod is
  #   refused and the start says which to run, is covered by the unit tests.
  # - Linux installs with --allow-scripts=node-pty, as the README says. Since
  #   1.2.0-beta the package ships Linux prebuilds (glibc x64 and arm64), and
  #   node-pty's loader reads `prebuilds/<platform>-<arch>` directly, so the
  #   "not allowed" case may now work without the flag where the prebuild
  #   matches; that is to verify in CI, and the case stays until it is.
  # - Linux without the flag, where no prebuild matches (another
  #   architecture, or musl), has no node-pty to load. There a start must
  #   refuse with the whole reinstall line, and the daemon must keep
  #   answering.
  package-npm12:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, case: 'no flag' }
          - { os: macos-latest, case: 'no flag' }
          - { os: ubuntu-latest, case: 'allowed', install-args: '--allow-scripts=node-pty' }
          - { os: ubuntu-latest, case: 'not allowed', start-fails-with: 'npm install -g --allow-scripts=node-pty shellpuppet' }
    name: package npm 12 (${{ matrix.os }}, ${{ matrix.case }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          cache: npm
      - run: npm install --global npm@12
      - run: npm ci
      - run: npm run build
      - run: node scripts/package-smoke.mjs
        env:
          SP_SMOKE_INSTALL_ARGS: ${{ matrix.install-args }}
          SP_SMOKE_START_FAILS_WITH: ${{ matrix.start-fails-with }}
